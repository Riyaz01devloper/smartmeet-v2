  <!-- Base Stem and Stand -->
  <line x1="256" y1="315" x2="256" y2="390" stroke="#ffffff" stroke-width="28" stroke-linecap="round" />
  <line x1="176" y1="390" x2="336" y2="390" stroke="#ffffff" stroke-width="28" stroke-linecap="round" />

  <!-- AI Sparkle / Star at Top Right -->
